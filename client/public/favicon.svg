  <path d="M 150,380 C 195,330 255,275 340,215" fill="none" stroke="#60a5fa" stroke-width="16" stroke-linecap="round"/>

  <!-- Ascending Airplane Silhouette -->
  <path d="M345 110 L280 185 L180 160 L230 220 L160 270 L120 250 L140 290 L210 300 L290 380 L305 370 L285 275 L375 170 Z" fill="#ffffff"/>
</svg>
