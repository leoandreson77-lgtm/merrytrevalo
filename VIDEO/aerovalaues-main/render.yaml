services:
  # Web Service (Full-stack Node.js + React)
  - type: web
    name: flight-search-engine
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_BOOKINGS_TO
        sync: false
      - key: EMAIL_OWNER
        sync: false
      - key: DUFFEL_ACCESS_TOKEN
        sync: false
      - key: DUFFEL_API_KEY
        sync: false
    healthCheckPath: /
